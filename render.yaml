services:
  - type: web
    name: flowchart-app
    runtime: docker
    plan: free
    region: singapore
    branch: main
    envVars:
      - key: APP_NAME
        value: "Flowchart App Siswa & Guru"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: file

